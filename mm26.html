<style>
  :root {
    --bg: #0a0e1a;
    --surface: #131929;
    --card: #1a2236;
    --border: #2a3a5c;
    --accent: #3b82f6;
    --accent2: #8b5cf6;
    --gold: #f59e0b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --win1: #22c55e;
    --winX: #eab308;
    --win2: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    border-bottom: 2px solid var(--accent);
    padding: 2rem 1rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '⚽';
    position: absolute;
    font-size: 8rem;
    opacity: 0.05;
    top: -1rem;
    left: 5%;
  }
  header::after {
    content: '🏆';
    position: absolute;
    font-size: 8rem;
    opacity: 0.05;
    top: -1rem;
    right: 5%;
  }
  header h1 {
    font-size: 2.2rem;
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  header p { color: var(--muted); margin-top: 0.4rem; font-size: 1rem; }

  main { max-width: 900px; margin: 0 auto; padding: 2rem 1rem 9rem; }

  .random-bar {
    margin-bottom: 1.5rem;
    display: flex;
    justify-content: flex-end;
  }
  .btn-random {
    background: linear-gradient(135deg, var(--accent2), #6d28d9);
    color: #fff;
  }
  .btn-random:hover { opacity: 0.9; transform: translateY(-1px); }

  .name-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 2rem;
  }
  .name-section label {
    display: block;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 0.5rem;
    font-size: 1.05rem;
  }
  .name-section input {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1.1rem;
    padding: 0.75rem 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .name-section input:focus { border-color: var(--accent); }
  .name-section input::placeholder { color: var(--muted); }

  .phase-block { margin-bottom: 2.5rem; }
  .phase-title {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--border);
  }
  .phase-title h2 {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--gold);
  }

  .group-block { margin-bottom: 1.5rem; }
  .group-label {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 0.5rem;
    padding-left: 0.5rem;
  }

  .match-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    margin-bottom: 0.5rem;
    display: grid;
    grid-template-columns: 2.5rem 1fr auto;
    align-items: center;
    gap: 0.75rem;
    transition: border-color 0.2s, background 0.2s;
  }
  .match-card:hover { border-color: var(--accent); background: #1e2d45; }
  .match-card.picked-1 { border-left: 3px solid var(--win1); }
  .match-card.picked-X { border-left: 3px solid var(--winX); }
  .match-card.picked-2 { border-left: 3px solid var(--win2); }

  .match-num {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--muted);
    text-align: center;
    background: var(--surface);
    border-radius: 6px;
    padding: 0.3rem 0;
  }
  .match-info { min-width: 0; }
  .match-teams {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.98rem;
    font-weight: 600;
    flex-wrap: wrap;
  }
  .team-home { color: var(--text); }
  .vs { color: var(--muted); font-size: 0.8rem; font-weight: 400; }
  .team-away { color: var(--text); }
  .match-meta {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 0.2rem;
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .bet-group {
    display: flex;
    gap: 0.4rem;
    flex-shrink: 0;
  }
  .bet-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }
  .bet-label input[type=radio] { display: none; }
  .bet-btn {
    width: 42px;
    height: 42px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-weight: 700;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    user-select: none;
  }
  .bet-label:hover .bet-btn { border-color: var(--accent); color: var(--text); }
  .bet-label input:checked ~ .bet-btn.btn-1 { background: var(--win1); border-color: var(--win1); color: #fff; }
  .bet-label input:checked ~ .bet-btn.btn-X { background: var(--winX); border-color: var(--winX); color: #000; }
  .bet-label input:checked ~ .bet-btn.btn-2 { background: var(--win2); border-color: var(--win2); color: #fff; }

  .action-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 50;
    background: rgba(10,14,26,0.95);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
    padding: 1rem;
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .progress-info {
    width: 100%;
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.25rem;
  }
  .progress-bar {
    width: 100%;
    max-width: 400px;
    margin: 0 auto 0.5rem;
    height: 4px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 999px;
    transition: width 0.3s;
    width: 0%;
  }
  .btn {
    padding: 0.75rem 1.8rem;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    letter-spacing: 0.3px;
  }
  .btn-preview {
    background: var(--surface);
    color: var(--text);
    border: 1.5px solid var(--accent);
  }
  .btn-preview:hover { background: var(--accent); color: #fff; }
  .btn-excel {
    background: linear-gradient(135deg, #16a34a, #15803d);
    color: #fff;
  }
  .btn-excel:hover { opacity: 0.9; transform: translateY(-1px); }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 700px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;

  .modal-header h3 { font-size: 1.2rem; font-weight: 700; color: var(--gold); }
  .modal-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.5rem;
    cursor: pointer;
    line-height: 1;
  }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 1.5rem; overflow-y: auto; }
  .modal-name { font-size: 1.1rem; margin-bottom: 1rem; color: var(--muted); }
  .modal-name strong { color: var(--text); }
  .preview-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }

    text-align: left;
    color: var(--muted);
    font-weight: 600;
    padding: 0.4rem 0.6rem;
    border-bottom: 1px solid var(--border);

  .preview-pick {

    border-radius: 5px;

  .pick-2 { background: var(--win2); color: #fff; }

  .modal-footer {
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 0.75rem;
    justify-content: flex-end;

  .done-view {
    display: none;
    text-align: center;
    padding: 3rem 1rem;
  }
  .done-view.show { display: block; }
  .done-view .icon { font-size: 4rem; margin-bottom: 1rem; }
  .done-view h2 { font-size: 1.8rem; font-weight: 800; color: var(--win1); margin-bottom: 0.5rem; }
  .done-view p { color: var(--muted); margin-bottom: 1.5rem; }
  .done-view .btn-again {
    background: var(--surface);
    color: var(--text);
    border: 1.5px solid var(--accent);
    padding: 0.75rem 1.8rem;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .done-view .btn-again:hover { background: var(--accent); color: #fff; }

  @media (max-width: 600px) {
    .match-card { grid-template-columns: 2rem 1fr; grid-template-rows: auto auto; gap: 0.5rem; }
    .bet-group { grid-column: 1 / -1; justify-content: flex-end; }
  }

</head>

    </div>
    <div class="random-bar">
      <button class="btn btn-random" onclick="randomizePicks()">🎲 Arvo vastaukset</button>
    </div>
    <form id="betForm"></form>
  </div>

  <div class="done-view" id="doneView">
    <div class="icon">📥</div>
    <h2>Excel-tiedosto ladattu!</h2>
    <p id="doneName"></p>
    <button class="btn-again" onclick="location.reload()">Tee uudet veikkaukset</button>
  </div>
</main>

<div class="action-bar" id="actionBar">
  <div class="progress-info" id="progressInfo">0 / 104 veikkausta tehty</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <button class="btn btn-preview" onclick="openPreview()">Esikatsele vastaukset</button>
  <button class="btn btn-excel" onclick="generateExcel(this)">📥 Muodosta Excel</button>
</div>

<!-- Preview Modal -->
<div class="modal-overlay" id="previewModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Esikatselu – veikkauksesi</h3>
      <button class="modal-close" onclick="closePreview()">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-name">Veikkaaja: <strong id="previewName">–</strong></div>
      <table class="preview-table">
        <thead>

            <th>#</th>
            <th>Ottelu</th>
            <th>Pvm</th>
            <th>Veto</th>
          </tr>
        </thead>
        <tbody id="previewBody"></tbody>
      </table>
    </div>
    <div class="modal-footer">
      <button class="btn btn-preview" onclick="closePreview()">Muokkaa</button>
      <button class="btn btn-excel" onclick="closePreview(); generateExcel(this)">📥 Muodosta Excel</button>
    </div>
  </div>
</div>

const PHASE_ORDER = ["Lohkovaihe","32 parasta","16 parasta","Puolivälierä","Välierä","Pronssiottelu","Finaali"];
const PHASE_ICONS = {"Lohkovaihe":"⚽","32 parasta":"🔵","16 parasta":"⚡","Puolivälierä":"🔥","Välierä":"💥","Pronssiottelu":"🥉","Finaali":"🏆"};

function buildForm() {
  const form = document.getElementById('betForm');
  const byPhase = {};
  MATCHES.forEach(m => {
    if (!byPhase[m.phase]) byPhase[m.phase] = {};
    const g = m.group || '_';
    if (!byPhase[m.phase][g]) byPhase[m.phase][g] = [];
    byPhase[m.phase][g].push(m);
  });

  PHASE_ORDER.forEach(phase => {
    if (!byPhase[phase]) return;
    const phaseDiv = document.createElement('div');
    phaseDiv.className = 'phase-block';
    phaseDiv.innerHTML = `<div class="phase-title"><span style="font-size:1.3rem">${PHASE_ICONS[phase]||'🎯'}</span><h2>${phase}</h2></div>`;

    const groups = byPhase[phase];
    Object.keys(groups).sort().forEach(gk => {
      const gDiv = document.createElement('div');
      gDiv.className = 'group-block';
      if (gk !== '_') gDiv.innerHTML = `<div class="group-label">Lohko ${gk}</div>`;
      groups[gk].forEach(m => {
        gDiv.innerHTML += `
          <div class="match-card" id="card-${m.n}">
            <div class="match-num">${m.n}</div>
            <div class="match-info">
              <div class="match-teams">
                <span class="team-home">${m.home}</span>
                <span class="vs">vs</span>
                <span class="team-away">${m.away}</span>
              </div>
              <div class="match-meta">
                <span>📅 ${m.date}</span>
                <span>🕐 ${m.time}</span>
                <span>📍 ${m.venue}</span>
              </div>
            </div>
            <div class="bet-group">
              <label class="bet-label">
                <input type="radio" name="m${m.n}" value="1" onchange="onPick(${m.n},'1')">
                <div class="bet-btn btn-1">1</div>
              </label>
              <label class="bet-label">
                <input type="radio" name="m${m.n}" value="X" onchange="onPick(${m.n},'X')">
                <div class="bet-btn btn-X">X</div>
              </label>
              <label class="bet-label">
                <input type="radio" name="m${m.n}" value="2" onchange="onPick(${m.n},'2')">
                <div class="bet-btn btn-2">2</div>
              </label>
            </div>
          </div>`;
      });
      phaseDiv.appendChild(gDiv);
    });
    form.appendChild(phaseDiv);
  });
}

function onPick(n, val) {
  const card = document.getElementById('card-' + n);
  card.className = 'match-card picked-' + val;
  updateProgress();
}

function updateProgress() {
  let count = 0;
  MATCHES.forEach(m => {
    if (document.querySelector(`input[name="m${m.n}"]:checked`)) count++;
  });
  document.getElementById('progressInfo').textContent = count + ' / 104 veikkausta tehty';
  document.getElementById('progressFill').style.width = (count / 104 * 100) + '%';
}

function openPreview() {
  const name = document.getElementById('playerName').value.trim() || '–';
  document.getElementById('previewName').textContent = name;
  const tbody = document.getElementById('previewBody');
  tbody.innerHTML = '';
  MATCHES.forEach(m => {
    const picked = document.querySelector(`input[name="m${m.n}"]:checked`);
    const val = picked ? picked.value : null;
    const pickHtml = val
      ? `<span class="preview-pick pick-${val}">${val}</span>`
      : `<span class="pick-none">–</span>`;
    tbody.innerHTML += `<tr>
      <td>${m.n}</td>
      <td>${m.home} vs ${m.away}</td>
      <td>${m.date}</td>
      <td>${pickHtml}</td>
    </tr>`;
  });
  document.getElementById('previewModal').classList.add('open');
}

function closePreview() {
  document.getElementById('previewModal').classList.remove('open');
}

async function generateExcel(btn) {
  const name = document.getElementById('playerName').value.trim();
  if (!name) { alert('Kirjoita ensin nimesi!'); document.getElementById('playerName').focus(); return; }

  let missing = 0;
  MATCHES.forEach(m => { if (!document.querySelector(`input[name="m${m.n}"]:checked`)) missing++; });
  if (missing > 0) {
    if (!confirm(`Sinulla on ${missing} veikkausta tekemättä. Haluatko silti luoda Excel-tiedoston?`)) return;
  }

  // Rakenna taulukkodata
  const rows = [
    ["Ottelu #", "Vaihe", "Lohko", "Päivämäärä", "Klo", "Pelipaikka", "Koti", "Vieras", "Veikkaus"]
  ];
  MATCHES.forEach(m => {
    const checked = document.querySelector(`input[name="m${m.n}"]:checked`);
    rows.push([
      m.n,
      m.phase,
      m.group || "-",
      m.date,
      m.time,
      m.venue,
      m.home,
      m.away,
      checked ? checked.value : ""
    ]);
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [
    {wch: 9}, {wch: 14}, {wch: 7}, {wch: 13},
    {wch: 6}, {wch: 24}, {wch: 22}, {wch: 22}, {wch: 9},
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Veikkaukset");

  const safeName = name.replace(/[^a-zA-Z0-9äöåÄÖÅ]/g, '_');
  const filename = `WC2026_veikkaus_${safeName}.xlsx`;

  // Luo Blob kaikille alustoille
  const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

  // iOS 15+: käytä Web Share API:a → avaa jakoikkuna (Tallenna Tiedostoihin / Numbers)
  if (navigator.share && navigator.canShare) {
    const file = new File([blob], filename, { type: blob.type });
    if (navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'WC2026 veikkaukset' });
      } catch (e) {
        if (e.name === 'AbortError') return; // käyttäjä sulki jakoikkunan
      }
      showDone(name);
      return;
    }
  }

  // Desktop ja Android: normaali lataus
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showDone(name);
}

function showDone(name) {
  document.getElementById('formView').style.display = 'none';
  document.getElementById('doneName').textContent = name + ' – tiedosto on tallennettu.';
  document.getElementById('doneView').classList.add('show');
}

function randomizePicks() {
  const options = ['1', 'X', '2'];
  MATCHES.forEach(m => {
    const val = options[Math.floor(Math.random() * 3)];
    const radio = document.querySelector(`input[name="m${m.n}"][value="${val}"]`);
    if (radio) { radio.checked = true; onPick(m.n, val); }
  });
}

document.getElementById('previewModal').addEventListener('click', function(e) {
  if (e.target === this) closePreview();
});

buildForm();
